
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAA FIDS Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>SAA FIDS Manager</h1>
            <p>Departure Check-in Display Management</p>
        </header>

        <div class="counter-heading">
            <h2>Check-in Counters</h2>
            <button id="refreshButton" type="button" onclick="refreshStatuses()">
                ↻ Refresh Status
            </button>
        </div>

        <p id="lastUpdated">Checking counter connections...</p>

        <!-- Counter buttons are generated by JavaScript -->
        <div id="counterGrid" class="counter-grid"></div>

        <section class="control-panel">
            <h2 id="selectedCounter">Counter 1</h2>


            <label for="slideSelect">Select Display</label>

            <select id="slideSelect">
                <option value="1">Slide 1 - SAA Welcome</option>
                <option value="2">Slide 2 - Chimpanzee</option>
                <option value="3">Slide 3 - IT Roster</option>
                <option value="4">Slide 4 - Red Flower</option>
                <option value="5">Slide 5 - Network Diagram</option>
                <option value="6">Slide 6 - Movie Scene</option>
                <option value="7">Slide 7 - Red X</option>
                <option value="8">Slide 8 - White Rabbit</option>
                <option value="9">Slide 9 - Lightning Bolt</option>
                <option value="10">Slide 10 - Health Potion</option>
                <option value="11">Slide 11 - Film Set</option>
                <option value="12">Slide 12 - Movie Collage</option>
                <option value="13">Slide 13 - Movie Character</option>
            </select>


            <button id="applyButton" onclick="applySlide()">
                Apply Display
            </button>

            <p id="status">Select a counter and display.</p>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
