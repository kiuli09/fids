
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAA FIDS Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

        <header>
            <button id="themeToggle" class="theme-toggle" type="button" aria-label="Switch to dark mode" title="Toggle light/dark mode"><span id="themeIcon" aria-hidden="true">☾</span><span id="themeLabel">Dark mode</span></button>
            <h1>SAA FIDS Manager</h1>
            <p>Departure Check-in Display Management</p>
        </header>

        <!-- Counter heading and refresh button -->
        <div class="counter-heading">
            <h2>Check-in Counters</h2>

            <button
                id="refreshButton"
                type="button"
                onclick="refreshStatuses()">
                Refres
            </button>
        </div>

        <p id="lastUpdated">
            Checking counter connections...
        </p>

        <!-- Counter buttons generated by JavaScript -->
        <div id="counterGrid" class="counter-grid"></div>

        <!-- Counter control panel -->
        <section class="control-panel">

            <h2 id="selectedCounter">Counter 1</h2>

            <!-- CURRENT DISPLAY -->
            <div class="current-display">
                <h3>Current Display</h3>

                <p id="currentDisplay">
                    Checking counter status...
                </p>

                <small id="currentSlideInfo"></small>
            </div>

            <!-- NEW DISPLAY -->
            <div class="new-display">
                <h3>New Display</h3>

                <label for="airlineSelect">
                    Select Airline
                </label>
                <select id="airlineSelect"></select>

                <label for="slideSelect">
                    Select Display
                </label>
                <select id="slideSelect"></select>

                <p id="presetInfo">
                    Choose an airline and display.
                </p>

                <button
                    id="applyButton"
                    type="button"
                    onclick="applySlide()">
                    Apply Display
                </button>
            </div>

            <!-- Action feedback -->
            <p id="status">
                Select a counter and display.
            </p>

        </section>

    </div>

    <script src="script.js"></script>
</body>
</html>
